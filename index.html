<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Doce Maria | Gestão Financeira</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <h1>🧁 Doce Maria — Sistema Financeiro</h1>
      <p>Gestão local (LocalStorage) para custos, ingredientes, receitas e vendas.</p>
    </header>

    <main>
      <nav class="tabs" id="tabs"></nav>

      <section class="panel" id="dashboard-panel"></section>
      <section class="panel hidden" id="custos-panel"></section>
      <section class="panel hidden" id="ingredientes-panel"></section>
      <section class="panel hidden" id="fichas-panel"></section>
      <section class="panel hidden" id="vendas-panel"></section>
    </main>

    <template id="card-template">
      <article class="card">
        <h3></h3>
        <p class="value"></p>
        <small></small>
      </article>
    </template>

    <script src="app.js"></script>
  </body>
</html>
